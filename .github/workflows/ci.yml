name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# 布局约定：本仓与兄弟仓(path 依赖 ../evorule、../evorule-hash)统一检出为
# GITHUB_WORKSPACE 下的子目录，使 Cargo.toml 的 ../ 解析与兄弟布局同构——
# 本仓若用默认检出（workspace 根），../evorule 会解析到 workspace 外一级，
# 与 checkout 的 path: evorule 错位一层（历史 CI 红根因）。
jobs:
  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: evorule-context-inspector

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: evorule-context-inspector

      # 本仓 path 依赖 ../evorule/evorule-reactor 等(工作区外),CI checkout 需同构布局
      - name: Checkout sibling evorule workspace
        uses: actions/checkout@v4
        with:
          repository: evorule/evorule
          ref: main
          path: evorule

      - name: Checkout sibling evorule-hash
        uses: actions/checkout@v4
        with:
          repository: evorule/evorule-hash
          ref: main
          path: evorule-hash

      - name: cargo fmt --check
        working-directory: evorule-context-inspector
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: evorule-context-inspector
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          path: evorule-context-inspector

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: evorule-context-inspector

      - name: Checkout sibling evorule workspace
        uses: actions/checkout@v4
        with:
          repository: evorule/evorule
          ref: main
          path: evorule

      - name: Checkout sibling evorule-hash
        uses: actions/checkout@v4
        with:
          repository: evorule/evorule-hash
          ref: main
          path: evorule-hash

      - name: cargo test
        working-directory: evorule-context-inspector
        run: cargo test

  coverage:
    name: Coverage (tarpaulin)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          path: evorule-context-inspector

      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout sibling evorule workspace
        uses: actions/checkout@v4
        with:
          repository: evorule/evorule
          ref: main
          path: evorule

      - name: Checkout sibling evorule-hash
        uses: actions/checkout@v4
        with:
          repository: evorule/evorule-hash
          ref: main
          path: evorule-hash

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run tarpaulin
        working-directory: evorule-context-inspector
        run: cargo tarpaulin --skip-clean --out Xml --timeout 600
