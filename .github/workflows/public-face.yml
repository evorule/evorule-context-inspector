name: public-face

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Public-face ratchet scan (tree)
        run: python scripts/public_face_scan.py --ratchet scripts/public-face-baseline.txt
      - name: Public-face scan (commit messages since deploy)
        run: python scripts/public_face_scan.py --commits-since "2026-10-20"
